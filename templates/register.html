{% extends "base.html" %}
{% block title %}Create User - {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="owl-icon large">🦉</span>
            <h1>Create User</h1>
            <p class="auth-subtitle">Admin only</p>
        </div>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus minlength="2">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required minlength="4">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create User</button>
        </form>
        <div class="auth-footer">
            <a href="/admin/users">Back to User Management</a>
        </div>
    </div>
</div>
{% endblock %}
